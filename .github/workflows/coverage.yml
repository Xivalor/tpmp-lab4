name: Code Coverage

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential lcov gcovr g++
      
      - name: Configure with coverage
        run: |
          mkdir -p build-coverage
          cd build-coverage
          cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug \
                   -DCMAKE_CXX_FLAGS="-coverage -fprofile-arcs -ftest-coverage" \
                   -DCMAKE_EXE_LINKER_FLAGS="-coverage -fprofile-arcs -ftest-coverage"
      
      - name: Build
        run: |
          cd build-coverage
          make -j$(nproc)
      
      - name: Run tests
        run: |
          cd build-coverage
          ctest --output-on-failure --verbose
      
      - name: Generate coverage report
        run: |
          cd build-coverage
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/googletest/*' '*/build-coverage/*' \
               --output-file coverage_filtered.info --ignore-errors unused
          lcov --list coverage_filtered.info
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/coverage_filtered.info
